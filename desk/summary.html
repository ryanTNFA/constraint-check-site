<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostic summary · The Growth Test</title>
<meta name="description" content="Diagnostic heat map: every node of the tree against benchmarking and the four tests, with the verdict layer's tier and the analyst's own conclusions.">
<script>(function(){try{var t=localStorage.getItem('desk-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
<link rel="preload" href="/growth-test-site/desk/fonts/newsreader-normal-400600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/growth-test-site/desk/fonts/inter-normal-300700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/growth-test-site/desk/css/tokens.css">
<link rel="stylesheet" href="/growth-test-site/desk/css/base.css">
<link rel="stylesheet" href="/growth-test-site/desk/css/components.css">
<link rel="stylesheet" href="/growth-test-site/desk/css/motion.css">
<link rel="stylesheet" href="/growth-test-site/desk/css/pages/summary.css">
<script src="/growth-test-site/desk/vendor/d3-7.9.0.min.js"></script>
</head>
<body data-page="heat">
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar"></header>
<main id="main" class="wrap sm" tabindex="-1">
  <header class="sm-head">
    <span class="kicker">Diagnostic summary</span>
    <h1 id="page-title" data-country-title>Diagnostic summary</h1>
    <script>(function(){var i=(new URLSearchParams(location.search).get('iso')||'').toUpperCase();if(i){document.getElementById('page-title').textContent=i+': diagnostic summary';document.title=i+' · '+document.title;}})();</script>
    <p class="sm-q">Across the tree, which constraints have consistent evidence?</p>
    <p class="sm-sub" id="page-sub"></p>
  </header>

  <p id="page-error" class="note alert" hidden></p>

  <form class="sm-controls" onsubmit="return false" aria-label="Summary settings">
    <label class="field"><span>Economy</span><select id="c-country"></select></label>
    <label class="field"><span>Comparators</span>
      <select id="c-set"><option value="structural">Structural</option><option value="regional">Regional</option><option value="aspirational">Aspirational</option></select></label>
  </form>

  <section aria-labelledby="h-heat">
    <h2 class="visually-hidden" id="h-heat">Heat map</h2>
    <div class="sm-key" id="key" aria-hidden="true"></div>
    <div class="sm-scroll" id="heat-wrap" role="region" aria-labelledby="h-heat" aria-describedby="readout foot" tabindex="0"></div>
    <p class="sm-readout" id="readout"></p>
    <p class="small muted sm-foot" id="foot"></p>
    <div class="sm-actions" role="group" aria-label="Export the heat map">
      <button class="btn small" id="x-png" type="button">PNG</button>
      <button class="btn small" id="x-svg" type="button">SVG</button>
      <button class="btn small" id="x-csv" type="button">CSV</button>
      <button class="btn small" id="x-md" type="button">Markdown table</button>
      <button class="btn quiet small" id="copy-link" type="button">Copy link with your conclusions</button>
      <a class="btn quiet small" id="to-snapshot" href="#">Open the Bottom line with your conclusions</a>
    </div>
  </section>
</main>

<footer class="foot"></footer>
<script type="module" src="/growth-test-site/desk/js/summary.mjs"></script>
</body>
</html>
