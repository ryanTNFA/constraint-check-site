<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottom line · The Growth Test</title>
<meta name="description" content="The Growth Test, a country's bottom line: which standard explanations for weak private investment the public data argue against, which deserve a closer look, and which no one can settle yet, with what would.">
<script>(function(){try{var t=localStorage.getItem('desk-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
<link rel="preload" href="/growth-test-site/desk/fonts/newsreader-normal-400600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/growth-test-site/desk/fonts/inter-normal-300700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/growth-test-site/desk/css/tokens.css">
<link rel="stylesheet" href="/growth-test-site/desk/css/base.css">
<link rel="stylesheet" href="/growth-test-site/desk/css/components.css">
<link rel="stylesheet" href="/growth-test-site/desk/css/motion.css">
<link rel="stylesheet" href="/growth-test-site/desk/css/pages/country.css">
<script>(function(){var q=new URLSearchParams(location.search);if(q.get('node')){location.replace(location.pathname.replace(/country\.html$/,'areas.html')+location.search+location.hash);}})();</script>
</head>
<body data-page="bottom">
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar"></header>
<main id="main" class="wrap bottom bl" tabindex="-1">
  <!-- The Bottom line (Growth Test PRD D1, D2, D3, D8, D9; shipped 6 November 2026): the question and its one sentence first,
       the three lists in the first screen, the caveats never folded. The economy comes from ?iso=; the inline line below writes
       its code before any module runs, so the shell's country row and the page agree. An old country.html?…&node= link opens
       the Areas level (the script in the head). -->
  <header class="k-head" id="head">
    <div class="k-head-text">
      <p class="k-meta" id="k-meta"><strong id="country-name" data-country-title>KEN</strong></p>
      <script>(function(){var i=(new URLSearchParams(location.search).get('iso')||'').toUpperCase();document.body.dataset.iso=i;document.getElementById('country-name').textContent=i;document.title=i+' · '+document.title;})();</script>
      <h1 class="k-question" id="k-question">What holds back private investment here?</h1>
      <p class="k-answer" id="k-answer" aria-live="polite"></p>
      <p class="k-peers small" id="k-peers"></p>
      <p id="fcs-note" class="note alert fcs-note" role="note" hidden></p>
      <p id="setting-note" class="note setting-note" role="status" hidden></p>
    </div>
    <div class="ctree-host" id="ctree-host"></div>
  </header>

  <p id="page-error" class="note alert" hidden></p>

  <section class="k-lists" id="statements" aria-label="Bottom line">
    <p class="k-fork" id="k-fork"></p>
    <div id="statements-body" class="k-three"></div>
    <div id="lists-help" class="k-lists-help"></div>
    <div id="overrides-box"></div>
  </section>

  <!-- D8 cards, under one plain <details> (no motion: the cards carry tier badges, and nothing animates a rating, tenet 6);
       closed by default so the words visible without interaction stay within D2's budget, half the current Bottom line -->
  <section class="k-cards" id="areas" aria-labelledby="areas-h">
    <details class="k-cards-fold" id="areas-fold">
      <summary class="k-sec-head"><h2 id="areas-h">Each area in one sentence</h2></summary>
      <p class="small muted k-sec-note">The plain sentence leads each card; its reasons, what would move the rating and the questions for two days in-country fold under it. Click an area’s name for its full evidence card.</p>
      <div id="cards-body" class="k-card-grid"></div>
    </details>
  </section>

  <aside class="tnfa-view k-tnfa" id="assistance-box" aria-label="What this means for U.S. assistance"></aside>

  <section class="k-tools" id="tools" aria-labelledby="tools-h">
    <h2 id="tools-h" class="visually-hidden">Take it further</h2>
    <div id="tools-body" class="k-tool-grid"></div>
  </section>
</main>

<footer class="foot"></footer>
<script type="module" src="/growth-test-site/desk/js/country.mjs"></script>
</body>
</html>
